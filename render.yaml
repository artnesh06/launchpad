services:
  - type: worker
    name: activity-listeners
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm run activity-listeners:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ETHEREUM_RPC_URL
        sync: false
      - key: POLYGON_RPC_URL
        sync: false
      - key: BSC_RPC_URL
        sync: false
      - key: ARBITRUM_RPC_URL
        sync: false
      - key: OPTIMISM_RPC_URL
        sync: false
      - key: BASE_RPC_URL
        sync: false
    autoDeploy: true
    healthCheckPath: /
